<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Data Mahasiswa</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 30px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Data Mahasiswa</h2>

    <table>
        <tr>
            <th>Nama</th>
            <th>NIM</th>
            <th>Prodi</th>
            <th>Fakultas</th>
        </tr>

        <tr>
            <td>Nama Mahasiswa 1</td>
            <td>12345678</td>
            <td>Ilmu Komunikasi</td>
            <td>Fakultas Ilmu Sosial dan Politik</td>
        </tr>

        <tr>
            <td>Nama Mahasiswa 2</td>
            <td>12345679</td>
            <td>Teknik Informatika</td>
            <td>Fakultas Teknik</td>
        </tr>

        <tr>
            <td>Nama Mahasiswa 3</td>
            <td>12345680</td>
            <td>Manajemen</td>
            <td>Fakultas Ekonomi</td>
        </tr>
    </table>

</body>
</html>
